<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title th:text="${!isEditMode} ? #{store.form.add} : #{store.form.edit}"></title>
    <div th:insert="~{common/menu :: header}"></div>
</head>
<body class="bg-light">
    <div th:insert="~{common/menu :: menu}"></div>

    <div class="container py-5">
        <div class="row justify-content-center">
            <div class="col-md-8">
                <div class="card shadow">
                    <div class="card-header bg-primary text-white">
                        <h3 class="card-title mb-0" th:text="${!isEditMode} ? #{store.form.add} : #{store.form.edit}"></h3>
                    </div>
                    <div class="card-body">
                        <form th:action="@{/stores}" th:object="${store}" method="post" class="needs-validation">
                            <!-- Store ID -->
                            <div class="mb-3">
                                <label class="form-label" th:text="#{store.id}">Identifiant :</label>
                                <input type="text" class="form-control" th:field="*{id}"
                                       th:readonly="${isEditMode}"
                                       th:classappend="${#fields.hasErrors('id')} ? 'is-invalid'">
                                <div class="invalid-feedback" th:if="${#fields.hasErrors('id')}" 
                                     th:errors="*{id}">Erreur</div>
                            </div>

                            <!-- Store Address -->
                            <div class="mb-3">
                                <label class="form-label" th:text="#{store.address}">Adresse :</label>
                                <input type="text" class="form-control" th:field="*{address}"
                                       th:classappend="${#fields.hasErrors('address')} ? 'is-invalid'">
                                <div class="invalid-feedback" th:if="${#fields.hasErrors('address')}" 
                                     th:errors="*{address}">Erreur</div>
                            </div>

                            <!-- Store Phone -->
                            <div class="mb-3">
                                <label class="form-label" th:text="#{store.phone}">Téléphone :</label>
                                <input type="text" class="form-control" th:field="*{phoneNumber}"
                                       th:classappend="${#fields.hasErrors('phoneNumber')} ? 'is-invalid'">
                                <div class="invalid-feedback" th:if="${#fields.hasErrors('phoneNumber')}" 
                                     th:errors="*{phoneNumber}">Erreur</div>
                            </div>

                            <div class="d-flex justify-content-end gap-2 mt-4">
                                <a href="/stores" class="btn btn-secondary" th:text="#{cancel}">Annuler</a>
                                <button type="submit" class="btn btn-primary" th:text="#{save}">Enregistrer</button>
                            </div>
                        </form>
                    </div>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
