<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title th:text="#{store.list.title}">Liste des magasins</title>
    <div th:insert="~{common/menu :: header}"></div>
</head>
<body class="bg-light">
    <div th:insert="~{common/menu :: menu}"></div>

    <div class="container py-5">
        <div class="row mb-4">
            <div class="col">
                <div>
                    <h1 class="h2 mb-0" th:text="#{store.list.title}">Liste des magasins</h1>
                    <a th:href="@{/stores/add}" class="btn btn-primary" th:text="#{store.add}">Ajouter un magasin</a>
                </div>
            </div>
        </div>

        <!-- Empty state message -->
        <div th:if="${#lists.isEmpty(stores)}" class="text-center py-5">
            <i class="bi bi-inbox display-1 text-muted"></i>
            <p class="h4 mt-3 text-muted" th:text="#{store.list.empty}">Aucun magasin enregistré</p>
        </div>

        <!-- Store table -->
        <div class="table-responsive" th:unless="${#lists.isEmpty(stores)}">
            <table class="table table-hover align-middle mb-0">
                <thead class="table-light">
                    <tr>
                        <th th:text="#{store.id}">Identifiant</th>
                        <th th:text="#{store.address}">Adresse</th>
                        <th th:text="#{store.phone}">Téléphone</th>
                        <th th:text="#{actions}">Actions</th>
                    </tr>
                </thead>
                <tbody>
                    <tr th:each="st : ${stores}">
                        <td th:text="${st.id}">S001</td>
                        <td th:text="${st.address}">123 Rue Principale</td>
                        <td th:text="${st.phoneNumber}">0102030405</td>
                        <td>
                            <a th:href="@{/stores/edit/{id}(id=${st.id})}" 
                               class="btn btn-info btn-sm" th:text="#{edit}">Modifier</a>
                            <a th:href="@{/stores/delete/{id}(id=${st.id})}"
                               class="btn btn-danger btn-sm" th:text="#{delete}"
                               onclick="return confirm('Supprimer ce magasin ?');">Supprimer</a>
                        </td>
                    </tr>
                </tbody>
            </table>
        </div>
    </div>
</body>
</html>
