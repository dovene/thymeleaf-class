<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title th:text="#{stock.list.title}">Liste du stock</title>
    <div th:insert="~{common/menu :: header}"></div>
</head>
<body class="bg-light">
    <div th:insert="~{common/menu :: menu}"></div>

    <div class="container py-5">
        <div class="row mb-4">
            <div class="col">
                <div>
                    <h1 class="h2 mb-0" th:text="#{stock.list.title}">Liste du stock</h1>
                    <a th:href="@{/stock/add}" class="btn btn-primary" th:text="#{stock.add}">Ajouter</a>
                </div>
            </div>
        </div>

        <!-- Empty state message -->
        <div th:if="${#lists.isEmpty(stock)}" class="text-center py-5">
            <i class="bi bi-inbox display-1 text-muted"></i>
            <p class="h4 mt-3 text-muted" th:text="#{stock.list.empty}">Aucune entrée de stock enregistrée</p>
        </div>

        <!-- Stock table -->
        <div class="table-responsive" th:unless="${#lists.isEmpty(stock)}">
            <table class="table table-hover align-middle mb-0">
                <thead class="table-light">
                    <tr>
                        <th th:text="#{product.reference}">Produit (Ref)</th>
                        <th th:text="#{store.id}">Magasin (ID)</th>
                        <th th:text="#{stock.quantity}">Quantité</th>
                        <th th:text="#{actions}">Actions</th>
                    </tr>
                </thead>
                <tbody>
                    <tr th:each="entry : ${stock}">
                        <td th:text="${entry.productReference}">REF</td>
                        <td th:text="${entry.storeId}">S001</td>
                        <td th:text="${entry.stockQuantity}">10</td>
                        <td>
                            <a th:href="@{/stock/edit/{prod}/{store}(prod=${entry.productReference}, store=${entry.storeId})}"
                               class="btn btn-info btn-sm" th:text="#{edit}">Modifier</a>
                            <a th:href="@{/stock/delete/{prod}/{store}(prod=${entry.productReference}, store=${entry.storeId})}"
                               class="btn btn-danger btn-sm" th:text="#{delete}"
                               onclick="return confirm('Supprimer cette entrée de stock ?');">Supprimer</a>
                        </td>
                    </tr>
                </tbody>
            </table>
        </div>
    </div>
</body>
</html>
