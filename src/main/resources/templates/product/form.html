<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
    <title th:text="${!isEditMode} ? #{product.form.add} :  #{product.form.edit}"></title>
    <link rel="stylesheet" href="../../css/style.css" />
</head>

<body>

    <div th:insert="~{common/menu :: menu}"></div>

    <h1 th:text="${!isEditMode} ? #{product.form.add} : #{product.form.edit}">
    </h1>

    <form th:action="@{/products}" th:object="${product}" method="post">
        <div>
            <label th:text="#{product.reference}">Référence :</label>
            <input type="text" th:field="*{reference}" th:readonly="${isEditMode} ? true : false" />
            <span class="error-message" th:if="${#fields.hasErrors('reference')}" th:errors="*{reference}">Erreur</span>
            <br /><br />
        </div>

        <div>
            <label th:text="#{product.designation}">Désignation :</label>
            <input type="text" th:field="*{designation}"/>
            <span class="error-message" th:if="${#fields.hasErrors('designation')}" th:errors="*{designation}">Erreur</span>
            <br /><br />
        </div>

        <div>
            <label th:text="#{product.quantityStock}">Quantité en stock :</label>
            <input type="number" th:field="*{quantityStock}" />
            <span class="error-message" th:if="${#fields.hasErrors('quantityStock')}" th:errors="*{quantityStock}">Erreur</span>
            <br /><br />
        </div>

        <div>
            <label th:text="#{product.category}">Catégorie :</label>
            <select th:field="*{category}">
                <option value="matériel">matériel</option>
                <option value="logiciel">logiciel</option>
                <option value="mixte">mixte</option>
            </select>
            <span class="error-message" th:if="${#fields.hasErrors('category')}" th:errors="*{category}">Erreur</span>
            <br /><br />
        </div>

        <div>
            <label th:text="#{product.alertQuantity}">Quantité d'alerte :</label>
            <input type="number" th:field="*{alertQuantity}" />
            <span class="error-message" th:if="${#fields.hasErrors('alertQuantity')}" th:errors="*{alertQuantity}">Erreur</span>
            <br /><br />
        </div>

        <div>
            <label th:text="#{product.salePrice}">Prix de vente :</label>
            <input type="number" th:field="*{salePrice}" />
            <span class="error-message" th:if="${#fields.hasErrors('salePrice')}" th:errors="*{salePrice}">Erreur</span>
            <br /><br />
        </div>

        <div>
            <label th:text="#{product.creationDate}">Date de création :</label>
            <input type="date" th:field="*{creationDate}"/>
            <span class="error-message" th:if="${#fields.hasErrors('creationDate')}" th:errors="*{creationDate}">Erreur</span>
            <br /><br />
        </div>

        <button type="submit" th:text="#{save}">Enregistrer</button>
    </form>

</body>

</html>
