<!-- resources/templates/product-form.html -->
<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title th:text="${product.reference} != null ? 'Modifier un produit' : 'Ajouter un produit'"></title>
</head>
<body>

<h1 th:text="${product.reference} != null ? 'Modification du produit ' + ${product.reference} : 'Ajout d\'un produit'"></h1>

<form th:action="@{/products}" th:object="${product}" method="post">
    <label>Référence :</label>
    <input type="text" th:field="*{reference}" 
           th:readonly="${product.reference} != null ? true : false" />
    <br/><br/>

    <label>Désignation :</label>
    <input type="text" th:field="*{designation}" />
    <br/><br/>

    <label>Quantité en stock :</label>
    <input type="number" th:field="*{quantityStock}" />
    <br/><br/>

    <label>Catégorie :</label>
    <select th:field="*{category}">
        <option value="matériel">matériel</option>
        <option value="logiciel">logiciel</option>
        <option value="mixte">mixte</option>
    </select>
    <br/><br/>

    <label>Quantité d'alerte :</label>
    <input type="number" th:field="*{alertQuantity}" />
    <br/><br/>

    <label>Prix de vente :</label>
    <input type="number" step="0.01" th:field="*{salePrice}" />
    <br/><br/>

    <label>Date de création :</label>
    <input type="date" th:field="*{creationDate}" />
    <br/><br/>

    <button type="submit">Enregistrer</button>
</form>

</body>
</html>
