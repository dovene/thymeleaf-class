<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
    <title th:text="${!isEditMode} ? #{product.form.add} :  #{product.form.edit}"></title>
    <div th:insert="~{common/menu :: header}"></div>
</head>

<body class="bg-light">
    <div th:insert="~{common/menu :: menu}"></div>

    <div class="container py-5">
        <div class="row justify-content-center">
            <div class="col-md-8">
                <div class="card shadow">
                    <div class="card-header bg-primary text-white">
                        <h3 class="card-title mb-0" th:text="${!isEditMode} ? #{product.form.add} : #{product.form.edit}"></h3>
                    </div>
                    <div class="card-body">
                        <form th:action="@{/products}" th:object="${product}" method="post" class="needs-validation">
                            <!-- Référence -->
                            <div class="mb-3">
                                <label class="form-label" th:text="#{product.reference}">Référence :</label>
                                <input type="text" class="form-control" th:field="*{reference}" 
                                       th:readonly="${isEditMode}"
                                       th:classappend="${#fields.hasErrors('reference')} ? 'is-invalid'">
                                <div class="invalid-feedback" th:if="${#fields.hasErrors('reference')}" 
                                     th:errors="*{reference}">Erreur</div>
                            </div>

                            <!-- Désignation -->
                            <div class="mb-3">
                                <label class="form-label" th:text="#{product.designation}">Désignation :</label>
                                <input type="text" class="form-control" th:field="*{designation}"
                                       th:classappend="${#fields.hasErrors('designation')} ? 'is-invalid'">
                                <div class="invalid-feedback" th:if="${#fields.hasErrors('designation')}" 
                                     th:errors="*{designation}">Erreur</div>
                            </div>

                            <!-- Quantité en stock -->
                            <div class="mb-3">
                                <label class="form-label" th:text="#{product.quantityStock}">Quantité en stock :</label>
                                <input type="number" class="form-control" th:field="*{quantityStock}"
                                       th:classappend="${#fields.hasErrors('quantityStock')} ? 'is-invalid'">
                                <div class="invalid-feedback" th:if="${#fields.hasErrors('quantityStock')}" 
                                     th:errors="*{quantityStock}">Erreur</div>
                            </div>

                            <!-- Catégorie -->
                            <div class="mb-3">
                                <label class="form-label" th:text="#{product.category}">Catégorie :</label>
                                <select class="form-select" th:field="*{category}"
                                        th:classappend="${#fields.hasErrors('category')} ? 'is-invalid'">
                                    <option value="matériel">matériel</option>
                                    <option value="logiciel">logiciel</option>
                                    <option value="mixte">mixte</option>
                                </select>
                                <div class="invalid-feedback" th:if="${#fields.hasErrors('category')}" 
                                     th:errors="*{category}">Erreur</div>
                            </div>

                            <!-- Quantité d'alerte -->
                            <div class="mb-3">
                                <label class="form-label" th:text="#{product.alertQuantity}">Quantité d'alerte :</label>
                                <input type="number" class="form-control" th:field="*{alertQuantity}"
                                       th:classappend="${#fields.hasErrors('alertQuantity')} ? 'is-invalid'">
                                <div class="invalid-feedback" th:if="${#fields.hasErrors('alertQuantity')}" 
                                     th:errors="*{alertQuantity}">Erreur</div>
                            </div>

                            <!-- Prix de vente -->
                            <div class="mb-3">
                                <label class="form-label" th:text="#{product.salePrice}">Prix de vente :</label>
                                <div class="input-group">
                                    <input type="number" class="form-control" th:field="*{salePrice}" step="0.01"
                                           th:classappend="${#fields.hasErrors('salePrice')} ? 'is-invalid'">
                                    <span class="input-group-text">€</span>
                                    <div class="invalid-feedback" th:if="${#fields.hasErrors('salePrice')}" 
                                         th:errors="*{salePrice}">Erreur</div>
                                </div>
                            </div>

                            <!-- Date de création -->
                            <div class="mb-3">
                                <label class="form-label" th:text="#{product.creationDate}">Date de création :</label>
                                <input type="date" class="form-control" th:field="*{creationDate}"
                                       th:classappend="${#fields.hasErrors('creationDate')} ? 'is-invalid'">
                                <div class="invalid-feedback" th:if="${#fields.hasErrors('creationDate')}" 
                                     th:errors="*{creationDate}">Erreur</div>
                            </div>

                            <div class="d-flex justify-content-end gap-2 mt-4">
                                <a href="/products" class="btn btn-secondary" th:text="#{cancel}">Annuler</a>
                                <button type="submit" class="btn btn-primary" th:text="#{save}">Enregistrer</button>
                            </div>
                        </form>
                    </div>
                </div>
            </div>
        </div>
    </div>
</body>

</html>
