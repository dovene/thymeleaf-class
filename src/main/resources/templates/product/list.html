<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
    <title>Liste des produits</title>
    <link rel="stylesheet" href="../../css/style.css" />
</head>

<body>

    <div th:insert="~{common/menu :: menu}"></div>

    <h1 th:text="#{product.list.title}">Liste des produits</h1>

    <!-- Lien pour ajouter un nouveau produit -->
    <a th:href="@{/products/add}" th:text="#{product.add}">Ajouter un produit</a>
    <br /><br />

    <!-- 
  Bloc qui s’affiche si la liste est vide 
  (#lists.isEmpty(products) retourne true si la liste est vide)
-->
    <div th:if="${products.isEmpty()}">
        <p th:text="#{product.list.empty}">Aucun produit enregistré.</p>
    </div>

    <!-- 
  Bloc qui s’affiche si la liste N’EST PAS vide 
  (th:unless = NOT de la condition ci-dessus)
-->
    <table th:unless="${products.isEmpty()}">
        <thead>
            <tr>
                <th th:text="#{product.reference}">Référence</th>
                <th th:text="#{product.designation}">Désignation</th>
                <th th:text="#{product.quantityStock}">Quantité en stock</th>
                <th th:text="#{product.category}">Catégorie</th>
                <th th:text="#{product.alertQuantity}">Quantité d'alerte</th>
                <th th:text="#{product.salePrice}">Prix de vente</th>
                <th th:text="#{product.creationDate}">Date de création</th>
                <th th:text="#{product.information}">Information</th>
                <th th:text="#{actions}">Actions</th>
            </tr>
        </thead>
        <tbody>
            <!-- Boucle sur la liste des produits si elle n'est pas vide -->
            <tr th:each="product : ${products}">
                <td th:text="${product.reference}">REF</td>
                <td th:text="${product.designation}">Désignation</td>
                <td th:text="${product.quantityStock}">0</td>
                <td th:text="${product.category}">catégorie</td>
                <td th:text="${product.alertQuantity}">0</td>
                <td th:text="${product.salePrice}">0.0</td>
                <!-- Formatage de date si besoin :
                 th:text="${#temporals.format(product.creationDate, 'dd/MM/yyyy')}" -->
                <td th:text="${#temporals.format(product.creationDate, 'dd/MM/yyyy')}">date</td>

                <!-- Colonne "Information" : rouge si stock < alerte, vert sinon -->
                <td>
                    <span th:if="${product.quantityStock} < ${product.alertQuantity}" class="red"
                        th:text="#{product.alertMessage}">Alerte stock</span>
                    <span th:if="${product.quantityStock} >= ${product.alertQuantity}" class="green"
                        th:text="#{product.okMessage}">Ok</span>
                </td>

                <!-- Actions : modifier / supprimer -->
                <td>
                    <a th:href="@{/products/edit/{ref}(ref=${product.reference})}" th:text="#{edit}">Modifier</a>
                    &nbsp;|&nbsp;
                    <a th:href="@{/products/delete/{ref}(ref=${product.reference})}"
                        onclick="return confirm('Voulez-vous vraiment supprimer ce produit ?');" th:text="#{delete}">
                        Supprimer
                    </a>
                </td>
            </tr>
        </tbody>
    </table>
</body>

</html>
